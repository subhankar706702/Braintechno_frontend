<div class="bt-info-box"><mat-icon fontSet="material-symbols-rounded">inventory_2</mat-icon><span>Use one product or build a product list. Turn on side scroller for horizontal browsing.</span></div>
            <label>Layout<select [(ngModel)]="block.content['layout']" (ngModelChange)="context.updateSelected()"><option value="grid">Grid</option><option value="list">List</option></select></label>
            <label class="bt-check"><input type="checkbox" [(ngModel)]="block.content['slider']" (ngModelChange)="context.updateSelected()"><span>Side scroller / product slider</span></label>
            <div class="repeat-editor">@for (item of block.content['items']; track $index) {
              <div class="repeat-card"><div class="repeat-card__head"><strong>Product {{ $index + 1 }}</strong><span><button type="button" (click)="context.moveRepeatItem(block, 'items', $index, -1)">↑</button><button type="button" (click)="context.moveRepeatItem(block, 'items', $index, 1)">↓</button><button type="button" (click)="context.removeRepeatItem(block, 'items', $index, 1)">×</button></span></div>
              <label>Name<input [(ngModel)]="item.name" (ngModelChange)="context.updateSelected()"></label><div class="bt-inline-fields"><label>Price<input [(ngModel)]="item.price" (ngModelChange)="context.updateSelected()"></label><label>Old price<input [(ngModel)]="item.oldPrice" (ngModelChange)="context.updateSelected()"></label></div><label>Badge<input [(ngModel)]="item.badge" (ngModelChange)="context.updateSelected()"></label><div class="bt-media-field bt-media-field--compact"><span class="bt-field-label">Product image</span>@if (item.image) { <img class="bt-media-preview bt-media-preview--small" [src]="item.image" alt=""> }<button type="button" class="bt-media-choose" (click)="context.openMediaPicker(item, 'image', 'mediaId', 'Choose product image')"><mat-icon fontSet="material-symbols-rounded">photo_library</mat-icon>{{ item.image ? 'Change image' : 'Choose from gallery' }}</button></div><label>Description<textarea [(ngModel)]="item.description" rows="3" (ngModelChange)="context.updateSelected()"></textarea></label><div class="bt-inline-fields"><label>CTA<input [(ngModel)]="item.cta" (ngModelChange)="context.updateSelected()"></label><label>URL<input [(ngModel)]="item.url" (ngModelChange)="context.updateSelected()"></label></div><label>Rating<input type="number" min="0" max="5" step="0.5" [(ngModel)]="item.rating" (ngModelChange)="context.updateSelected()"></label>
              </div> }
            </div><button type="button" class="bt-add-repeat" (click)="context.addRepeatItem(block, 'items')">+ Add product</button>
