<section class="settings-page settings-page--individual">
  <header class="settings-header">
    <div>
      <h1>Settings</h1>
      <p>Manage your app preferences and account settings</p>
    </div>
  </header>

  <div class="settings-layout settings-layout--individual">
    <main class="settings-content settings-content--individual">
      <section class="settings-panel">

          <header class="settings-panel__header">
            <div>
              <h2>
                Privacy & Data
              </h2>
              <p>
                Manage local data and privacy preferences
              </p>
            </div>
          </header>


          <div class="settings-list">

            <button
              type="button"
              class="settings-row"
              (click)="toggleAnalytics()"
            >
              <span class="settings-row__copy">
                <strong>
                  Product analytics
                </strong>
                <small>
                  Allow anonymous product usage analytics
                </small>
              </span>
              <span
                class="switch"
                [class.switch--on]="analytics()"
              >
                <span></span>
              </span>
            </button>

          </div>


          <button
            type="button"
            class="secondary-action"
            (click)="clearCache()"
          >
            <mat-icon>
              delete_sweep
            </mat-icon>

            Clear local cache
          </button>

        </section>
      <div class="settings-actions">
        <button type="button" class="button button--secondary" (click)="resetSettings()">Reset to default</button>
        <button type="button" class="button button--primary" (click)="saveChanges()">Save changes</button>
      </div>
    </main>
  </div>
</section>
