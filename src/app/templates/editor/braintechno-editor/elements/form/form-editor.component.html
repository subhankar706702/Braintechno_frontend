<label>Title<input [(ngModel)]="block.content['title']" (ngModelChange)="context.updateSelected()"></label><label>Subtitle<textarea [(ngModel)]="block.content['subtitle']" rows="3" (ngModelChange)="context.updateSelected()"></textarea></label>
            <div class="bt-form-field-toolbar"><strong>Form fields</strong><select #newFieldType><option value="text">Text</option><option value="email">Email</option><option value="phone">Phone</option><option value="number">Number</option><option value="textarea">Textarea</option><option value="select">Dropdown</option><option value="radio">Radio</option><option value="checkbox">Checkbox</option><option value="date">Date</option><option value="time">Time</option><option value="datetime">Date & time</option></select><button type="button" (click)="context.addFormField(block, newFieldType.value)">+ Add</button></div>
            <div class="repeat-editor">@for (field of block.content['fields']; track field.id; let fieldIndex = $index) { <div class="repeat-card"><div class="repeat-card__head"><strong>{{ field.label || 'Field' }}</strong><span><button type="button" (click)="context.moveRepeatItem(block, 'fields', fieldIndex, -1)">↑</button><button type="button" (click)="context.moveRepeatItem(block, 'fields', fieldIndex, 1)">↓</button><button type="button" (click)="context.removeRepeatItem(block, 'fields', fieldIndex, 1)">×</button></span></div><label>Type<select [(ngModel)]="field.type" (ngModelChange)="context.changeFormFieldType(block, field, $event)"><option value="text">Text</option><option value="email">Email</option><option value="phone">Phone</option><option value="number">Number</option><option value="textarea">Textarea</option><option value="select">Dropdown</option><option value="radio">Radio</option><option value="checkbox">Checkbox</option><option value="date">Date</option><option value="time">Time</option><option value="datetime">Date & time</option></select></label><label>Label<input [(ngModel)]="field.label" (ngModelChange)="context.updateSelected()"></label><label>Field name<input [(ngModel)]="field.name" (ngModelChange)="context.updateSelected()"></label><label>Placeholder<input [(ngModel)]="field.placeholder" (ngModelChange)="context.updateSelected()"></label>@if (field.type === 'select' || field.type === 'radio') { <label>Options (one per line)<textarea [(ngModel)]="field.options" rows="4" (ngModelChange)="context.updateSelected()"></textarea></label> }<label>Width<select [(ngModel)]="field.width" (ngModelChange)="context.updateSelected()"><option value="full">Full</option><option value="half">Half</option><option value="third">Third</option></select></label><label class="bt-check"><input type="checkbox" [(ngModel)]="field.required" (ngModelChange)="context.updateSelected()"><span>Required</span></label></div> }</div>
            <label>Button text<input [(ngModel)]="block.content['submitLabel']" (ngModelChange)="context.updateSelected()"></label><label>Submit API<input [(ngModel)]="block.content['submitUrl']" (ngModelChange)="context.updateSelected()"></label><label>Success message<textarea [(ngModel)]="block.content['successMessage']" rows="2" (ngModelChange)="context.updateSelected()"></textarea></label><label>Error message<textarea [(ngModel)]="block.content['errorMessage']" rows="2" (ngModelChange)="context.updateSelected()"></textarea></label>
