<label>Title<input [(ngModel)]="block.content['title']" (ngModelChange)="context.updateSelected()"></label>
<label>Subtitle<textarea [(ngModel)]="block.content['subtitle']" rows="2" (ngModelChange)="context.updateSelected()"></textarea></label>

<div class="bt-inline-fields">
  <label>Desktop layout
    <select [(ngModel)]="block.content['desktopLayout']" (ngModelChange)="context.updateSelected()">
      <option value="grid">Grid</option>
      <option value="row">Side by side</option>
    </select>
  </label>
  <label>Desktop columns
    <input type="number" min="1" max="6" [(ngModel)]="block.style['columns']" (ngModelChange)="context.updateSelected()">
  </label>
</div>

<div class="bt-inline-fields">
  <label>Mobile layout
    <select [(ngModel)]="block.content['mobileLayout']" (ngModelChange)="context.updateSelected()">
      <option value="stack">Stack / Down</option>
      <option value="scroll">Side scroll</option>
      <option value="dropdown">Dropdown / Accordion</option>
    </select>
  </label>
  <label>Gap (px)
    <input type="number" min="0" max="80" [(ngModel)]="block.style['gap']" (ngModelChange)="context.updateSelected()">
  </label>
</div>

<div class="bt-inline-fields">
  <label>Text color<input type="color" [(ngModel)]="block.style['textColor']" (ngModelChange)="updateDarkSafe()"></label>
  <label>Accent color<input type="color" [(ngModel)]="block.style['accent']" (ngModelChange)="context.updateSelected()"></label>
</div>

<div class="bt-inline-fields">
  <label>Background color<input type="color" [(ngModel)]="block.style['background']" (ngModelChange)="setColorBackground()"></label>
  <label>Overlay color<input type="text" [(ngModel)]="block.style['overlay']" (ngModelChange)="context.updateSelected()" placeholder="rgba(15,23,42,.52)"></label>
</div>

<div class="bt-media-field bt-media-field--compact">
  <span class="bt-field-label">Background image</span>
  @if (block.style['backgroundImage']) {
    <img class="bt-media-preview bt-media-preview--small" [src]="block.style['backgroundImage']" alt="Stats background">
  }
  <div class="bt-media-actions">
    <button type="button" class="bt-media-choose" (click)="chooseBackgroundImage()">
      <mat-icon fontSet="material-symbols-rounded">photo_library</mat-icon>
      {{ block.style['backgroundImage'] ? 'Change image' : 'Choose image' }}
    </button>
    @if (block.style['backgroundImage']) {
      <button type="button" class="bt-media-remove" (click)="removeBackgroundImage()">Remove</button>
    }
  </div>
</div>

<div class="bt-inline-fields">
  <label>Image fit
    <select [(ngModel)]="block.style['backgroundSize']" (ngModelChange)="context.updateSelected()">
      <option value="cover">Cover</option>
      <option value="contain">Contain</option>
      <option value="auto">Auto</option>
    </select>
  </label>
  <label>Image position
    <select [(ngModel)]="block.style['backgroundPosition']" (ngModelChange)="context.updateSelected()">
      <option value="center">Center</option>
      <option value="top">Top</option>
      <option value="bottom">Bottom</option>
      <option value="left">Left</option>
      <option value="right">Right</option>
    </select>
  </label>
</div>

<div class="bt-inline-fields">
  <label>Element radius (px)
    <input type="number" min="0" max="60" [(ngModel)]="block.style['radius']" (ngModelChange)="context.updateSelected()">
  </label>
  <label>Card radius (px)
    <input type="number" min="0" max="60" [(ngModel)]="block.style['cardRadius']" (ngModelChange)="context.updateSelected()">
  </label>
</div>

<div class="bt-inline-fields">
  <label>Margin top (px)
    <input type="number" min="0" max="120" [(ngModel)]="block.style['marginTop']" (ngModelChange)="context.updateSelected()">
  </label>
  <label>Margin bottom (px)
    <input type="number" min="0" max="120" [(ngModel)]="block.style['marginBottom']" (ngModelChange)="context.updateSelected()">
  </label>
</div>

<div class="bt-inline-fields">
  <label class="bt-check">
    <input type="checkbox" [(ngModel)]="block.content['showTitle']" (ngModelChange)="context.updateSelected()">
    <span>Show title</span>
  </label>
  <label class="bt-check">
    <input type="checkbox" [(ngModel)]="block.content['showSubtitle']" (ngModelChange)="context.updateSelected()">
    <span>Show subtitle</span>
  </label>
</div>

<div class="bt-inline-fields">
  <label class="bt-check">
    <input type="checkbox" [(ngModel)]="block.content['showIcons']" (ngModelChange)="context.updateSelected()">
    <span>Show icons</span>
  </label>
  <label class="bt-check">
    <input type="checkbox" [(ngModel)]="block.content['showProgress']" (ngModelChange)="context.updateSelected()">
    <span>Show progress</span>
  </label>
</div>

<div class="repeat-editor">
  @for (item of block.content['items']; track $index) {
    <div class="repeat-card">
      <div class="repeat-card__head">
        <strong>Stat {{ $index + 1 }}</strong>
        <span>
          <button type="button" (click)="context.moveRepeatItem(block, 'items', $index, -1)">↑</button>
          <button type="button" (click)="context.moveRepeatItem(block, 'items', $index, 1)">↓</button>
          <button type="button" (click)="context.removeRepeatItem(block, 'items', $index, 1)">×</button>
        </span>
      </div>

      <label>Value<input [(ngModel)]="item.value" (ngModelChange)="context.updateSelected()"></label>

      <div class="bt-inline-fields">
        <label>Prefix<input [(ngModel)]="item.prefix" (ngModelChange)="context.updateSelected()"></label>
        <label>Suffix<input [(ngModel)]="item.suffix" (ngModelChange)="context.updateSelected()"></label>
      </div>

      <label>Label<input [(ngModel)]="item.label" (ngModelChange)="context.updateSelected()"></label>
      <label>Description<textarea [(ngModel)]="item.text" rows="2" (ngModelChange)="context.updateSelected()"></textarea></label>
      <label>Progress (0-100)<input type="number" min="0" max="100" [(ngModel)]="item.progress" (ngModelChange)="context.updateSelected()"></label>
      <label>Icon<input [(ngModel)]="item.icon" (ngModelChange)="context.updateSelected()" placeholder="monitoring, groups..."></label>
    </div>
  }
</div>

<button type="button" class="bt-add-repeat" (click)="context.addRepeatItem(block, 'items')">+ Add stat</button>
