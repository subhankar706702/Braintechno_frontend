<label>Title<input [(ngModel)]="block.content['title']" (ngModelChange)="context.updateSelected()"></label>
            <div class="repeat-editor">@for (plan of block.content['plans']; track $index) { <div class="repeat-card"><div class="repeat-card__head"><strong>Plan {{ $index + 1 }}</strong><span><button type="button" (click)="context.moveRepeatItem(block, 'plans', $index, -1)">↑</button><button type="button" (click)="context.moveRepeatItem(block, 'plans', $index, 1)">↓</button><button type="button" (click)="context.removeRepeatItem(block, 'plans', $index)">×</button></span></div><label>Name<input [(ngModel)]="plan.name" (ngModelChange)="context.updateSelected()"></label><label>Price<input [(ngModel)]="plan.price" (ngModelChange)="context.updateSelected()"></label><label>Period<input [(ngModel)]="plan.period" (ngModelChange)="context.updateSelected()"></label><label>Features<textarea [(ngModel)]="plan.features" rows="4" (ngModelChange)="context.updateSelected()"></textarea></label><label>CTA<input [(ngModel)]="plan.cta" (ngModelChange)="context.updateSelected()"></label></div> }</div><button type="button" class="bt-add-repeat" (click)="context.addRepeatItem(block, 'plans')">+ Add plan</button>
