<div class="repeat-editor">@for (item of block.content['items']; track $index) { <div class="repeat-card"><div class="repeat-card__head"><strong>Social {{ $index + 1 }}</strong><button type="button" (click)="context.removeRepeatItem(block, 'items', $index)">×</button></div><label>Platform<select [(ngModel)]="item.platform" (ngModelChange)="context.changeSocialPlatform(block, item, $event)"><option value="facebook">Facebook</option><option value="instagram">Instagram</option><option value="youtube">YouTube</option><option value="linkedin">LinkedIn</option><option value="telegram">Telegram</option><option value="x">X / Twitter</option><option value="whatsapp">WhatsApp</option><option value="website">Website</option><option value="github">GitHub</option><option value="tiktok">TikTok</option></select></label><label>URL<input [(ngModel)]="item.url" (ngModelChange)="context.updateSelected()"></label><label>Label<input [(ngModel)]="item.label" (ngModelChange)="context.updateSelected()"></label></div> }</div><button type="button" class="bt-add-repeat" (click)="context.addRepeatItem(block, 'items')">+ Add social link</button>
