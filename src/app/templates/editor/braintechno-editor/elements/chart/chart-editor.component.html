<label>Title<input [(ngModel)]="block.content['title']" (ngModelChange)="context.updateSelected()"></label><label>Chart type<select [(ngModel)]="block.content['chartType']" (ngModelChange)="context.updateSelected()"><option value="bar">Bar</option><option value="line">Line</option><option value="pie">Pie</option><option value="doughnut">Doughnut</option></select></label><div class="repeat-editor">@for (item of block.content['items']; track $index) { <div class="repeat-card"><div class="repeat-card__head"><strong>Data {{ $index + 1 }}</strong><button type="button" (click)="context.removeRepeatItem(block, 'items', $index, 1)">×</button></div><label>Label<input [(ngModel)]="item.label" (ngModelChange)="context.updateSelected()"></label><label>Value<input type="number" [(ngModel)]="item.value" (ngModelChange)="context.updateSelected()"></label></div> }</div><button type="button" class="bt-add-repeat" (click)="context.addRepeatItem(block, 'items')">+ Add data</button><div class="bt-inline-fields"><label class="bt-check"><input type="checkbox" [(ngModel)]="block.content['showLegend']" (ngModelChange)="context.updateSelected()"><span>Legend</span></label><label class="bt-check"><input type="checkbox" [(ngModel)]="block.content['showValues']" (ngModelChange)="context.updateSelected()"><span>Values</span></label></div><label>Accent color<input type="color" [(ngModel)]="block.style['accent']" (ngModelChange)="context.updateSelected()"></label>
