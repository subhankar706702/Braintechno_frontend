    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: #f7f9fc;
            color: #0f172a
        }

        header {
            position: sticky;
            top: 0;
            z-index: 5;
            padding: 18px 22px;
            background: #fff;
            border-bottom: 1px solid #e2e8f0
        }

        h1 {
            margin: 0 0 10px;
            font-size: 22px
        }

        input {
            width: min(640px, 100%);
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font: inherit
        }

        main {
            padding: 20px
        }

        .cat {
            margin: 0 0 28px
        }

        .cat h2 {
            font-size: 15px;
            margin: 0 0 12px
        }

        .cat h2 span {
            color: #94a3b8;
            font-weight: 500
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 10px
        }

        .icon {
            min-height: 92px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer
        }

        .icon:hover {
            border-color: #ff8aa0;
            box-shadow: 0 6px 18px rgba(15, 23, 42, .08)
        }

        .icon .material-symbols-rounded {
            font-size: 30px;
            color: #ff4d6d
        }

        .icon b {
            font-size: 11px;
            word-break: break-word
        }

        .hidden {
            display: none !important
        }
    </style>
</head>
