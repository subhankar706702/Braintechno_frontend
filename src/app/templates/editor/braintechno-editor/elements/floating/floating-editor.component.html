<div class="bt-info-box"><mat-icon fontSet="material-symbols-rounded">touch_app</mat-icon><span>Compact floating actions. Default 1; add more only when needed.</span></div><div class="repeat-editor">@for (item of block.content['items']; track $index) { <div class="repeat-card"><div class="repeat-card__head"><strong>Action {{ $index + 1 }}</strong><button type="button" (click)="context.removeRepeatItem(block, 'items', $index, 1)">×</button></div><label>Icon<input [(ngModel)]="item.icon" (ngModelChange)="context.updateSelected()"></label><label>Label<input [(ngModel)]="item.label" (ngModelChange)="context.updateSelected()"></label><label>URL / action<input [(ngModel)]="item.url" (ngModelChange)="context.updateSelected()"></label></div> }</div><button type="button" class="bt-add-repeat" (click)="context.addRepeatItem(block, 'items')">+ Add action</button>
