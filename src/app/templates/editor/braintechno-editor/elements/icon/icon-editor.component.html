<div class="bt-icon-field">
              <span class="bt-field-label">Material icon</span>
              <details class="bt-icon-picker bt-icon-picker--large">
                <summary>
                  <span class="bt-icon-selected"><mat-icon fontSet="material-symbols-rounded">{{ block.content['materialIcon'] || 'star' }}</mat-icon></span>
                  <span>Choose icon</span>
                  <mat-icon class="bt-icon-picker-chevron" fontSet="material-symbols-rounded">expand_more</mat-icon>
                </summary>
                <div class="bt-icon-picker-panel">
                  @for (category of context.materialIconCategories; track category.label) {
                    <div class="bt-icon-category">
                      <div class="bt-icon-category-title">{{ category.label }}</div>
                      <div class="bt-icon-grid">
                        @for (iconName of category.icons; track iconName) {
                          <button type="button" class="bt-icon-option" [class.active]="block.content['materialIcon'] === iconName" (click)="block.content['materialIcon'] = iconName; context.updateSelected()" aria-label="Select icon">
                            <mat-icon fontSet="material-symbols-rounded">{{ iconName }}</mat-icon>
                          </button>
                        }
                      </div>
                    </div>
                  }
                </div>
              </details>
            </div>
            <div class="bt-icon-current-preview bt-icon-current-preview--visual"><mat-icon fontSet="material-symbols-rounded">{{ block.content['materialIcon'] || 'star' }}</mat-icon></div>
            <label>Label<input [(ngModel)]="block.content['label']" (ngModelChange)="context.updateSelected()"></label>
            <label>Icon size<input type="number" [(ngModel)]="block.style['iconSize']" (ngModelChange)="context.updateSelected()"></label>
            <label>Icon color<input type="color" [(ngModel)]="block.style['iconColor']" (ngModelChange)="context.updateSelected()"></label>
            <label>Icon background<input type="color" [(ngModel)]="block.style['iconBg']" (ngModelChange)="context.updateSelected()"></label>
