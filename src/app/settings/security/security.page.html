<section class="settings-page settings-page--individual">
  <header class="settings-header">
    <div>
      <h1>Settings</h1>
      <p>Manage your app preferences and account settings</p>
    </div>
  </header>

  <div class="settings-layout settings-layout--individual">
    <main class="settings-content settings-content--individual">
      <section class="settings-panel">

          <header class="settings-panel__header">
            <div>
              <h2>
                Security
              </h2>
              <p>
                Manage password and active sessions
              </p>
            </div>
          </header>


          <div class="action-list">

            <button
              type="button"
              class="action-card"
            >
              <span class="action-card__icon">
                <mat-icon>
                  password
                </mat-icon>
              </span>

              <span>
                <strong>
                  Change password
                </strong>
                <small>
                  Update your account password
                </small>
              </span>

              <mat-icon>
                chevron_right
              </mat-icon>
            </button>


            <button
              type="button"
              class="action-card"
            >
              <span class="action-card__icon">
                <mat-icon>
                  devices
                </mat-icon>
              </span>

              <span>
                <strong>
                  Active sessions
                </strong>
                <small>
                  Review devices signed in to your account
                </small>
              </span>

              <mat-icon>
                chevron_right
              </mat-icon>
            </button>


            <button
              type="button"
              class="action-card action-card--danger"
            >
              <span class="action-card__icon">
                <mat-icon>
                  logout
                </mat-icon>
              </span>

              <span>
                <strong>
                  Logout all devices
                </strong>
                <small>
                  End every active login session
                </small>
              </span>

              <mat-icon>
                chevron_right
              </mat-icon>
            </button>

          </div>

        </section>
      <div class="settings-actions">
        <button type="button" class="button button--secondary" (click)="resetSettings()">Reset to default</button>
        <button type="button" class="button button--primary" (click)="saveChanges()">Save changes</button>
      </div>
    </main>
  </div>
</section>
