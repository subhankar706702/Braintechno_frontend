<div class="bt-media-field"><span class="bt-field-label">Slider images</span><div class="gallery-manager">@for (image of block.content['images']; track $index) { @if (image) { <div class="gallery-item"><img [src]="image" alt=""></div> } }</div><button type="button" class="bt-media-choose" (click)="context.openMultipleMediaPicker(block.content, 'images', 'mediaIds', 'Choose slider images')"><mat-icon fontSet="material-symbols-rounded">collections</mat-icon>Choose images from gallery</button></div><label>Slide time (seconds)<input type="number" min="1" step="1" [ngModel]="(block.content['interval'] || 3500) / 1000" (ngModelChange)="block.content['interval'] = (+$event || 1) * 1000; context.updateSelected()"></label><label class="bt-check"><input type="checkbox" [(ngModel)]="block.content['autoplay']" (ngModelChange)="context.updateSelected()"><span>Autoplay</span></label>
