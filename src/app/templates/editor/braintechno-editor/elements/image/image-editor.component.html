<div class="bt-media-field"><span class="bt-field-label">Image</span>@if (block.content['url']) { <img class="bt-media-preview" [src]="block.content['url']" [alt]="block.content['alt'] || ''"> } @else { <div class="bt-media-empty"><mat-icon fontSet="material-symbols-rounded">image</mat-icon><span>No image selected</span></div> }<div class="bt-media-actions"><button type="button" class="bt-media-choose" (click)="context.openMediaPicker(block.content, 'url', 'mediaId', 'Choose image')"><mat-icon fontSet="material-symbols-rounded">photo_library</mat-icon>{{ block.content['url'] ? 'Change image' : 'Choose from gallery' }}</button>@if (block.content['url']) { <button type="button" class="bt-media-remove" (click)="context.clearMedia(block.content, 'url', 'mediaId')">Remove</button> }</div></div>
            <label>Alt text<input [(ngModel)]="block.content['alt']" (ngModelChange)="context.updateSelected()"></label>
            <div class="bt-inline-fields"><label>Width (%)<input type="number" min="1" max="100" [(ngModel)]="block.style['imageWidth']" (ngModelChange)="context.updateSelected()"></label><label>Height (% of width)<input type="number" min="1" max="200" [(ngModel)]="block.style['imageHeight']" (ngModelChange)="context.updateSelected()"></label></div>
