<div class="repeat-editor">@for (item of block.content['items']; track $index) { <div class="repeat-card"><div class="repeat-card__head"><strong>Counter {{ $index + 1 }}</strong><button type="button" (click)="context.removeRepeatItem(block, 'items', $index)">×</button></div><label>Start<input type="number" [(ngModel)]="item.start" (ngModelChange)="context.updateSelected()"></label><label>End<input type="number" [(ngModel)]="item.end" (ngModelChange)="context.updateSelected()"></label><label>Prefix<input [(ngModel)]="item.prefix" (ngModelChange)="context.updateSelected()"></label><label>Suffix<input [(ngModel)]="item.suffix" (ngModelChange)="context.updateSelected()"></label><label>Label<input [(ngModel)]="item.label" (ngModelChange)="context.updateSelected()"></label><label>Animation duration ms<input type="number" [(ngModel)]="item.duration" (ngModelChange)="context.updateSelected()"></label></div> }</div><button type="button" class="bt-add-repeat" (click)="context.addRepeatItem(block, 'items')">+ Add counter</button>
