<label>Phone<input [(ngModel)]="block.content['phone']" (ngModelChange)="context.updateSelected()"></label><label>Email<input [(ngModel)]="block.content['email']" (ngModelChange)="context.updateSelected()"></label><label>Address<textarea [(ngModel)]="block.content['address']" rows="3" (ngModelChange)="context.updateSelected()"></textarea></label><label>Business hours<input [(ngModel)]="block.content['hours']" (ngModelChange)="context.updateSelected()"></label>
            <div class="repeat-editor">@for (action of block.content['actions']; track $index) { <div class="repeat-card"><div class="repeat-card__head"><strong>Contact action {{ $index + 1 }}</strong><button type="button" (click)="context.removeRepeatItem(block, 'actions', $index, 0)">×</button></div><label>Type<select [(ngModel)]="action.platform" (ngModelChange)="context.updateSelected()"><option value="whatsapp">WhatsApp</option><option value="facebook">Facebook</option><option value="instagram">Instagram</option><option value="linkedin">LinkedIn</option><option value="youtube">YouTube</option><option value="telegram">Telegram</option><option value="website">Website</option><option value="x">X / Twitter</option></select></label><label>Label<input [(ngModel)]="action.label" (ngModelChange)="context.updateSelected()"></label><label>URL<input [(ngModel)]="action.url" (ngModelChange)="context.updateSelected()"></label></div> }</div><button type="button" class="bt-add-repeat" (click)="context.addRepeatItem(block, 'actions')">+ Add contact action</button>
