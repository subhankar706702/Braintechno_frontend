<div class="confirm-dialog" [class.confirm-dialog--success]="type === 'success'" [class.confirm-dialog--warning]="type === 'warning'" [class.confirm-dialog--danger]="type === 'danger'" [class.confirm-dialog--info]="type === 'info'">
  <div class="confirm-dialog__icon-wrap">
    <div class="confirm-dialog__icon-ring"></div>
    <div class="confirm-dialog__icon">
      <mat-icon>{{ resolvedIcon }}</mat-icon>
    </div>
  </div>

  <div class="confirm-dialog__body">
    <h2>{{ data.title }}</h2>

    @if (data.subtitle) {
      <p>{{ data.subtitle }}</p>
    }
  </div>

  <div class="confirm-dialog__actions" [class.confirm-dialog__actions--single]="!showCancel">
    @if (showCancel) {
      <button type="button" class="confirm-dialog__button confirm-dialog__button--cancel" (click)="cancel()">
        {{ cancelButtonName }}
      </button>
    }

    <button type="button" class="confirm-dialog__button confirm-dialog__button--confirm" (click)="confirm()">
      {{ successButtonName }}
    </button>
  </div>
</div>
