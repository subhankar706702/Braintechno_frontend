<label>Title<input [(ngModel)]="block.content['title']" (ngModelChange)="context.updateSelected()"></label><label>Text<textarea [(ngModel)]="block.content['text']" rows="2" (ngModelChange)="context.updateSelected()"></textarea></label><label>Max rating<input type="number" min="1" max="10" [(ngModel)]="block.content['max']" (ngModelChange)="context.updateSelected()"></label><label>Submit API<input [(ngModel)]="block.content['submitUrl']" (ngModelChange)="context.updateSelected()"></label><label>Button text<input [(ngModel)]="block.content['submitLabel']" (ngModelChange)="context.updateSelected()"></label><label>Success message<input [(ngModel)]="block.content['successMessage']" (ngModelChange)="context.updateSelected()"></label><label class="bt-check"><input type="checkbox" [(ngModel)]="block.content['allowComment']" (ngModelChange)="context.updateSelected()"><span>Allow comment</span></label>
