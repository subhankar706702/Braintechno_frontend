<div class="bt-media-field"><span class="bt-field-label">Gallery images</span><div class="gallery-manager">@for (image of block.content['images']; track $index) { @if (image) { <div class="gallery-item"><img [src]="image" alt=""><button type="button" (click)="context.removeGalleryImage(block, $index)"><mat-icon fontSet="material-symbols-rounded">close</mat-icon></button></div> } }</div><button type="button" class="bt-media-choose" (click)="context.openMultipleMediaPicker(block.content, 'images', 'mediaIds', 'Choose gallery images')"><mat-icon fontSet="material-symbols-rounded">photo_library</mat-icon>Choose images from gallery</button></div>
