<div class="repeat-editor">@for (item of block.content['items']; track $index) { <div class="repeat-card"><div class="repeat-card__head"><strong>Button {{ $index + 1 }}</strong><span><button type="button" (click)="context.moveRepeatItem(block, 'items', $index, -1)">↑</button><button type="button" (click)="context.moveRepeatItem(block, 'items', $index, 1)">↓</button><button type="button" (click)="context.removeRepeatItem(block, 'items', $index)">×</button></span></div><label>Text<input [(ngModel)]="item.label" (ngModelChange)="context.updateSelected()"></label><label>URL / route<input [(ngModel)]="item.url" (ngModelChange)="context.updateSelected()"></label><label>Target<select [(ngModel)]="item.target" (ngModelChange)="context.updateSelected()"><option value="_self">Same tab</option><option value="_blank">New tab</option></select></label><label>Icon<input [(ngModel)]="item.icon" (ngModelChange)="context.updateSelected()"></label></div> }</div>
            <button type="button" class="bt-add-repeat" (click)="context.addRepeatItem(block, 'items')">+ Add button</button>
            <label>Button color<input type="color" [(ngModel)]="block.style['buttonBg']" (ngModelChange)="context.updateSelected()"></label><label>Text color<input type="color" [(ngModel)]="block.style['buttonText']" (ngModelChange)="context.updateSelected()"></label>
