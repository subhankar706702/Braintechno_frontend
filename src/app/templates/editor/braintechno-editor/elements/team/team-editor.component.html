<label>Title<input [(ngModel)]="block.content['title']" (ngModelChange)="context.updateSelected()"></label>
            <div class="repeat-editor">@for (item of block.content['items']; track $index) { <div class="repeat-card"><div class="repeat-card__head"><strong>Member {{ $index + 1 }}</strong><span><button type="button" (click)="context.moveRepeatItem(block, 'items', $index, -1)">↑</button><button type="button" (click)="context.moveRepeatItem(block, 'items', $index, 1)">↓</button><button type="button" (click)="context.removeRepeatItem(block, 'items', $index)">×</button></span></div><label>Name<input [(ngModel)]="item.name" (ngModelChange)="context.updateSelected()"></label><label>Role<input [(ngModel)]="item.role" (ngModelChange)="context.updateSelected()"></label><div class="bt-media-field bt-media-field--compact"><span class="bt-field-label">Profile image</span>@if (item.image) { <img class="bt-avatar-preview" [src]="item.image" alt=""> }<button type="button" class="bt-media-choose" (click)="context.openMediaPicker(item, 'image', 'mediaId', 'Choose team image')"><mat-icon fontSet="material-symbols-rounded">photo_library</mat-icon>{{ item.image ? 'Change image' : 'Choose from gallery' }}</button></div><label>Bio<textarea [(ngModel)]="item.bio" rows="2" (ngModelChange)="context.updateSelected()"></textarea></label><label>Facebook<input [(ngModel)]="item.facebook" (ngModelChange)="context.updateSelected()"></label><label>Instagram<input [(ngModel)]="item.instagram" (ngModelChange)="context.updateSelected()"></label><label>LinkedIn<input [(ngModel)]="item.linkedin" (ngModelChange)="context.updateSelected()"></label></div> }</div><button type="button" class="bt-add-repeat" (click)="context.addRepeatItem(block, 'items')">+ Add team member</button>
