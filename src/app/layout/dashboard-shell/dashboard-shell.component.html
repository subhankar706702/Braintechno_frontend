<div class="shell">

  @if (mobileMenuOpen) {
    <button
      type="button"
      class="mobile-backdrop"
      aria-label="Close menu"
      (click)="closeMobileMenu()"
    ></button>
  }

  <aside
    class="sidebar"
    [class.sidebar--open]="mobileMenuOpen"
  >

    <div class="sidebar__brand">

      <img
        class="sidebar__brand-logo"
        [src]="businessLogo"
        [alt]="businessName"
        (error)="onLogoError($event)"
      />

      <div class="sidebar__brand-copy">

        <strong>
          {{ businessName }}
        </strong>

        <span>
          Business workspace
        </span>

      </div>

      <button
        type="button"
        class="sidebar__close"
        aria-label="Close menu"
        (click)="closeMobileMenu()"
      >
        <mat-icon>
          close
        </mat-icon>
      </button>

    </div>


    <nav class="sidebar-nav">

      @for (
        item of sidebarItems;
        track item.route
      ) {

        <button
          type="button"
          class="sidebar-nav__item"
          [class.sidebar-nav__item--active]="
            isActive(item.route)
          "
          (click)="openPage(item.route)"
        >

          <mat-icon>
            {{ item.icon }}
          </mat-icon>

          <span>
            {{ item.label }}
          </span>

        </button>

      }

    </nav>


    <div class="sidebar-promo">

      <div class="sidebar-promo__icon">
        <mat-icon>
          trending_up
        </mat-icon>
      </div>

      <strong>
        Turn ideas into opportunities
      </strong>

      <p>
        Create pages, manage campaigns
        and grow your business online.
      </p>

    </div>

  </aside>


  <section class="shell-content">

    <header class="topbar">

      <div class="topbar__mobile-left">

        <button
          type="button"
          class="mobile-menu-button"
          aria-label="Open menu"
          (click)="toggleMobileMenu()"
        >
          <span>
            menu
          </span>
        </button>

        <img
          class="topbar__mobile-logo"
          [src]="businessLogo"
          [alt]="businessName"
          (error)="onLogoError($event)"
        />

      </div>


      <div class="topbar__spacer"></div>


      <div class="topbar__actions">

        <button
          type="button"
          class="topbar-icon-button"
          aria-label="Notifications"
          title="Notifications"
        >
          <mat-icon>
            notifications_none
          </mat-icon>
        </button>

        <div class="topbar-business">

          <img
            class="topbar-business__logo"
            [src]="businessLogo"
            [alt]="businessName"
            (error)="onLogoError($event)"
          />

          <span class="topbar-business__name">
            {{ businessName }}
          </span>

        </div>

      </div>

    </header>


    <main class="page-content">

      <router-outlet />

    </main>

  </section>

</div>
