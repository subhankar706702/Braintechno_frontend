<label>Title<input [(ngModel)]="block.content['title']" (ngModelChange)="context.updateSelected()"></label><label>Upload media/documents<input type="file" multiple accept="image/*,.pdf,.doc,.docx,.txt,.csv" (change)="context.onMediaFiles($event, block)"></label><div class="bt-info-box"><mat-icon fontSet="material-symbols-rounded">cloud_off</mat-icon><span>These uploads are saved inside this template design. True account-wide media needs a backend media API/storage.</span></div><div class="media-manager">@for (file of block.content['files']; track $index) { <div class="media-row"><mat-icon fontSet="material-symbols-rounded">{{ file.type?.startsWith('image/') ? 'image' : 'description' }}</mat-icon><span>{{ file.name }}</span><button type="button" (click)="context.removeMediaFile(block, $index)"><mat-icon fontSet="material-symbols-rounded">close</mat-icon></button></div> }</div>
