<label>Title<input [(ngModel)]="block.content['title']" (ngModelChange)="context.updateSelected()"></label>
            <div class="repeat-editor">@for (item of block.content['items']; track $index) { <div class="repeat-card"><div class="repeat-card__head"><strong>FAQ {{ $index + 1 }}</strong><span><button type="button" (click)="context.moveRepeatItem(block, 'items', $index, -1)">↑</button><button type="button" (click)="context.moveRepeatItem(block, 'items', $index, 1)">↓</button><button type="button" (click)="context.removeRepeatItem(block, 'items', $index)">×</button></span></div><label>Question<input [(ngModel)]="item.q" (ngModelChange)="context.updateSelected()"></label><label>Answer<textarea [(ngModel)]="item.a" rows="3" (ngModelChange)="context.updateSelected()"></textarea></label></div> }</div><button type="button" class="bt-add-repeat" (click)="context.addRepeatItem(block, 'items')">+ Add FAQ</button>
