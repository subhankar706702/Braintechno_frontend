<div class="repeat-editor">@for (item of block.content['items']; track $index) {
              <div class="repeat-card"><div class="repeat-card__head"><strong>Offer {{ $index + 1 }}</strong><span><button type="button" (click)="context.moveRepeatItem(block, 'items', $index, -1)">↑</button><button type="button" (click)="context.moveRepeatItem(block, 'items', $index, 1)">↓</button><button type="button" (click)="context.removeRepeatItem(block, 'items', $index, 1)">×</button></span></div><label>Badge<input [(ngModel)]="item.badge" (ngModelChange)="context.updateSelected()"></label><label>Title<input [(ngModel)]="item.title" (ngModelChange)="context.updateSelected()"></label><label>Discount<input [(ngModel)]="item.discount" (ngModelChange)="context.updateSelected()"></label><div class="bt-media-field bt-media-field--compact"><span class="bt-field-label">Product image</span>@if (item.image) { <img class="bt-media-preview bt-media-preview--small" [src]="item.image" alt=""> }<button type="button" class="bt-media-choose" (click)="context.openMediaPicker(item, 'image', 'mediaId', 'Choose product image')"><mat-icon fontSet="material-symbols-rounded">photo_library</mat-icon>{{ item.image ? 'Change image' : 'Choose from gallery' }}</button></div><label>Description<textarea [(ngModel)]="item.description" rows="3" (ngModelChange)="context.updateSelected()"></textarea></label><div class="bt-inline-fields"><label>CTA<input [(ngModel)]="item.cta" (ngModelChange)="context.updateSelected()"></label><label>URL<input [(ngModel)]="item.url" (ngModelChange)="context.updateSelected()"></label></div></div> }
            </div><button type="button" class="bt-add-repeat" (click)="context.addRepeatItem(block, 'items')">+ Add offer</button>
